# Adaptado del YAML del Job que el usuario ejecutó correctamente.
# Las rutas son relativas a este archivo; los seis notebooks van en baci_cr/.
resources:
  jobs:
    baci_cr_pipeline:
      name: baci_cr_pipeline

      # Una ejecución simultánea de este Job; no limita otros Jobs.
      max_concurrent_runs: 1

      # Databricks entrega el parámetro a cada tarea de notebook.
      # El target dev escribe en baci_dev; no cambia las tablas del dashboard.
      parameters:
        - name: entorno
          default: ${bundle.target}

      tasks:
        - task_key: 01_archivos_raw
          notebook_task:
            notebook_path: ../baci_cr/01_archivos_raw.py
            source: WORKSPACE

        - task_key: 02_comercio_enriquecido
          depends_on:
            - task_key: 01_archivos_raw
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../baci_cr/02_comercio_enriquecido.py
            source: WORKSPACE

        - task_key: 03_indicadores_cr
          depends_on:
            - task_key: 02_comercio_enriquecido
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../baci_cr/03_indicadores_cr.py
            source: WORKSPACE

        - task_key: 04_validaciones
          depends_on:
            - task_key: 03_indicadores_cr
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../baci_cr/04_validaciones.py
            source: WORKSPACE

      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
