# Configuración del proyecto. El workspace se elige con el perfil de la CLI.
bundle:
  name: baci_cr

include:
  - resources/*.yml

# Cada usuario despliega dentro de su carpeta, sin un correo fijo en el código.
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development
